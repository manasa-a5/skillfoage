server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/skillforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: CHANGE_ME_TO_A_256_BIT_BASE64_SECRET_CHANGE_ME
    expiration-ms: 86400000
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

management:
  endpoints:
    web:
      exposure:
        include: health,info
